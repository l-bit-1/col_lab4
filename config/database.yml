default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>

development:
  <<: *default
  database: department_student_application_development

test:
  <<: *default
  database: department_student_application_test

production:
  primary: &primary_production
    <<: *default
    database: department_student_application_production
    username: department_student_application
    password: <%= ENV["DEPARTMENT_STUDENT_APPLICATION_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: department_student_application_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: department_student_application_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: department_student_application_production_cable
    migrations_paths: db/cable_migrate
